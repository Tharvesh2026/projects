spring.application.name=api-gate-way
server.port=8443

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.netflix.server.webflux.discovery.enabled = true

#Static Routing - product
spring.cloud.gateway.server.webflux.routes[0].id=product
spring.cloud.gateway.server.webflux.routes[0].uri = lb://PRODUCT
spring.cloud.gateway.server.webflux.routes[0].predicates[0] = Path=/api/product/**

#Static Routing - order
spring.cloud.gateway.server.webflux.routes[1].id=order
spring.cloud.gateway.server.webflux.routes[1].uri = lb://ORDER
spring.cloud.gateway.server.webflux.routes[1].predicates[0] = Path=/api/orders/**