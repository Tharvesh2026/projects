<!DOCTYPE html>
<html th:replace="~{layout :: html}">
<head>
    <title>Products | Nexus Store</title>
</head>
<body>
    <div th:fragment="content">
        
        <section class="hero-banner">
            <h1>Premium Collection</h1>
            <p>Discover our exclusive range of monochrome essentials. Engineered for perfection, designed for you.</p>
        </section>

        <section class="container">
            <!-- Empty State -->
            <div th:if="${products == null or products.empty}" style="text-align:center; padding: 4rem 0;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:1rem;"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                <h2>No products found</h2>
                <p>We're updating our catalogue. Check back soon.</p>
            </div>

            <!-- Product Grid -->
            <div th:if="${products != null and !products.empty}" class="product-grid">
                <div class="product-card" th:each="product : ${products}">
                    
                    <div class="product-image-mock">
                        <!-- Mock Image Icon -->
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    </div>

                    <div class="product-info">
                        <h3 th:text="${product.name}">Product Name</h3>
                        <div class="rating">
                            <span>★★★★☆</span>
                            <span class="rating-count">(1,204)</span>
                        </div>
                        
                        <div class="price-section">
                            <span class="price" th:text="${'$' + product.price}">$0.00</span>
                            <span class="mrp" th:text="${'$' + (product.price * 1.2)}">$0.00</span> <!-- Mock Original Price -->
                        </div>
                    </div>

                    <div class="product-actions">
                        <button class="btn-secondary">Add to Cart</button>
                        <a th:href="@{/checkout(productId=${product.id})}" class="btn-primary">Buy Now</a>
                    </div>
                </div>
            </div>
        </section>

    </div>
</body>
</html>
