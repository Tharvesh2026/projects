<!DOCTYPE html>
<html th:replace="~{layout :: html}">
<head>
    <title>OTP Verification</title>
</head>
<body>
    <div th:fragment="content">
        <form action="/verify-otp" method="post" style="max-width: 400px; margin: 4rem auto;">
            <h1 style="margin-bottom: 2rem; text-align: center;">Verify OTP</h1>
            
            <div style="background-color: var(--card-bg); padding: 2rem; border-radius: 12px; border: 1px solid var(--border);">
                
                <p style="text-align: center; margin-bottom: 1.5rem;">We sent a 6-digit OTP to your email: <strong th:text="${email}"></strong></p>

                <div th:if="${error}" style="color: red; margin-bottom: 1rem; text-align: center;" th:text="${error}"></div>

                <input type="hidden" name="email" th:value="${email}">
                
                <div class="form-group">
                    <label for="otp">Enter OTP</label>
                    <input type="text" id="otp" name="otp" placeholder="123456" maxlength="6" required style="text-align: center; letter-spacing: 4px; font-size: 1.5rem;">
                </div>
                
                <button type="submit" style="width: 100%; margin-top: 1rem;">Verify Account</button>
            </div>
        </form>
    </div>
</body>
</html>
