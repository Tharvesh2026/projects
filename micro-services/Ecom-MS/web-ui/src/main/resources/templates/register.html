<!DOCTYPE html>
<html th:replace="~{layout :: html}">
<head>
    <title>Register</title>
</head>
<body>
    <div th:fragment="content">
        <form action="/register" method="post" style="max-width: 400px; margin: 4rem auto;">
            <h1 style="margin-bottom: 2rem; text-align: center;">Register</h1>
            
            <div style="background-color: var(--card-bg); padding: 2rem; border-radius: 12px; border: 1px solid var(--border);">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required style="width:100%; height:48px; border: 1px solid var(--border); padding: 0 1rem; border-radius: 6px; box-sizing: border-box;">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required style="width:100%; height:48px; border: 1px solid var(--border); padding: 0 1rem; border-radius: 6px; box-sizing: border-box;">
                </div>
                
                <button type="submit" style="width: 100%; margin-top: 1rem;">Register</button>
            </div>
        </form>
    </div>
</body>
</html>
