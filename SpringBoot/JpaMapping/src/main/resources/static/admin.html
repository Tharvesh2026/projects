<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CourseMapping | Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="index.html">CourseMapping</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="students.html">Students</a></li>
                <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
                <li class="nav-item"><a class="nav-link active" href="admin.html">Admin</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">

    <section class="page-header">
        <h1 class="fw-bold">Admin Panel</h1>
        <p class="mb-0">Danger zone for database flush operations.</p>
    </section>

    <div id="adminMessage" class="message-box"></div>

    <section class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card card-custom">
                <div class="card-body">
                    <h5 class="fw-bold mb-3 text-danger">Flush Database</h5>

                    <p class="text-muted">
                        This action will delete data from the database. Use only for testing.
                    </p>

                    <form id="flushForm">
                        <div class="mb-3">
                            <label class="form-label">Admin Password</label>
                            <input type="password" id="adminPassword" class="form-control" placeholder="Enter password" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Entity</label>
                            <select id="entity" class="form-select" required>
                                <option value="">Select entity</option>
                                <option value="students">Students only</option>
                                <option value="courses">Courses only</option>
                                <option value="all">Students + Courses</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-danger btn-custom w-100">
                            Flush Database
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>

</main>

<footer class="text-center py-3 footer-text">
    CourseMapping | Admin
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>

<script>
    const flushForm = document.getElementById("flushForm");

    flushForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const password = document.getElementById("adminPassword").value;
        const entity = document.getElementById("entity").value;

        const confirmFlush = confirm(`Are you sure you want to flush: ${entity}?`);

        if (!confirmFlush) return;

        try {
            const url = `${ADMIN_API}/flush?password=${encodeURIComponent(password)}&entity=${encodeURIComponent(entity)}`;

            await requestApi(url, {
                method: "DELETE"
            });

            showMessage("adminMessage", "Database flushed successfully");
            flushForm.reset();

        } catch (error) {
            showMessage("adminMessage", error.message, "error");
        }
    });
</script>

</body>
</html>
