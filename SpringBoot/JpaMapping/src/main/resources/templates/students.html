<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CourseMapping | Students</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="index.html">CourseMapping</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="students.html">Students</a></li>
                <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
                <li class="nav-item"><a class="nav-link" href="admin.html">Admin</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">

    <section class="page-header">
        <h1 class="fw-bold">Students</h1>
        <p class="mb-0">Register students with a course and manage student records.</p>
    </section>

    <div id="studentMessage" class="message-box"></div>

    <section class="row g-4">
        <div class="col-lg-4">
            <div class="card card-custom">
                <div class="card-body">
                    <h5 class="fw-bold mb-3" id="studentFormTitle">Add Student</h5>

                    <form id="studentForm">
                        <input type="hidden" id="rollNo">

                        <div class="mb-3">
                            <label class="form-label">Student Name</label>
                            <input type="text" id="studentName" class="form-control" placeholder="Alice" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Gender</label>
                            <select id="gender" class="form-select" required>
                                <option value="">Select gender</option>
                                <option value="M">Male</option>
                                <option value="F">Female</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Course</label>
                            <select id="courseId" class="form-select" required>
                                <option value="">Loading courses...</option>
                            </select>
                        </div>

                        <button class="btn btn-primary btn-custom w-100" type="submit">Save Student</button>

                        <button class="btn btn-outline-secondary btn-custom w-100 mt-2" type="button" onclick="resetStudentForm()">
                            Reset
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card card-custom">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">Student List</h5>

                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                            <tr>
                                <th>Roll No</th>
                                <th>Name</th>
                                <th>Gender</th>
                                <th>Course</th>
                                <th>Action</th>
                            </tr>
                            </thead>
                            <tbody id="studentTable">
                            <tr>
                                <td colspan="5" class="text-muted">Loading...</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>
    </section>

</main>

<footer class="text-center py-3 footer-text">
    CourseMapping | Students
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>

<script>
    const studentForm = document.getElementById("studentForm");

    studentForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const rollNo = document.getElementById("rollNo").value;

        const studentData = {
            name: document.getElementById("studentName").value.trim(),
            gender: document.getElementById("gender").value,
            courseId: Number(document.getElementById("courseId").value)
        };

        try {
            if (rollNo) {
                await requestApi(`${STUDENT_API}/${rollNo}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(studentData)
                });

                showMessage("studentMessage", "Student updated successfully");
            } else {
                await requestApi(STUDENT_API, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(studentData)
                });

                showMessage("studentMessage", "Student created successfully");
            }

            resetStudentForm();
            loadStudents();

        } catch (error) {
            showMessage("studentMessage", error.message, "error");
        }
    });

    async function loadCoursesForDropdown() {
        try {
            const response = await requestApi(COURSE_API);
            const courses = response.data || [];

            const dropdown = document.getElementById("courseId");
            dropdown.innerHTML = `<option value="">Select course</option>`;

            courses.forEach(course => {
                const id = course.courseId || course.course_id;

                dropdown.innerHTML += `
                    <option value="${id}">
                        ${course.code} - ${course.title}
                    </option>
                `;
            });

        } catch (error) {
            showMessage("studentMessage", "Please add courses before adding students", "error");
        }
    }

    async function loadStudents() {
        try {
            const response = await requestApi(STUDENT_API);
            const students = response.data || [];

            const table = document.getElementById("studentTable");
            table.innerHTML = "";

            if (students.length === 0) {
                table.innerHTML = `<tr><td colspan="5" class="text-muted">No students found</td></tr>`;
                return;
            }

            students.forEach(student => {
                table.innerHTML += `
                    <tr>
                        <td>${student.rollNo}</td>
                        <td>${student.name}</td>
                        <td>${student.gender}</td>
                        <td>
                            <span class="badge-soft">
                                ${student.course?.code || "N/A"}
                            </span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick='editStudent(${JSON.stringify(student)})'>Edit</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteStudent(${student.rollNo})">Delete</button>
                        </td>
                    </tr>
                `;
            });

        } catch (error) {
            showMessage("studentMessage", error.message, "error");
        }
    }

    function editStudent(student) {
        document.getElementById("studentFormTitle").textContent = "Update Student";
        document.getElementById("rollNo").value = student.rollNo;
        document.getElementById("studentName").value = student.name;
        document.getElementById("gender").value = student.gender;

        const id = student.course?.courseId || student.course?.course_id;
        document.getElementById("courseId").value = id;
    }

    function resetStudentForm() {
        document.getElementById("studentFormTitle").textContent = "Add Student";
        document.getElementById("rollNo").value = "";
        studentForm.reset();
    }

    async function deleteStudent(rollNo) {
        const confirmDelete = confirm(`Are you sure you want to delete student rollNo: ${rollNo}?`);

        if (!confirmDelete) return;

        try {
            await requestApi(`${STUDENT_API}/${rollNo}`, {
                method: "DELETE"
            });

            showMessage("studentMessage", "Student deleted successfully");
            loadStudents();

        } catch (error) {
            showMessage("studentMessage", error.message, "error");
        }
    }

    loadCoursesForDropdown();
    loadStudents();
</script>

</body>
</html>
