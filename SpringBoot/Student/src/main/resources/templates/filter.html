<!DOCTYPE html>
<html>
<head>
    <title>Filter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<h2 class="text-xl font-bold mb-4">🎯 Filter Students</h2>

<input id="course" placeholder="Course" class="border p-2">
<button onclick="filter()" class="bg-purple-500 text-white px-4 py-2 rounded">
    Filter
</button>

<table class="w-full mt-4 bg-white shadow">
    <tbody id="table"></tbody>
</table>

<br>
<a href="/" class="text-blue-500">Back</a>

<script>
    function filter() {

        const course = document.getElementById("course").value;

        fetch(`http://localhost:9090/api/v01/students/filtersBy?course=${course}`)
            .then(res => res.json())
            .then(data => {

                let table = document.getElementById("table");
                table.innerHTML = "";

                data.data.forEach(s => {
                    table.innerHTML += `
                    <tr class="border-b text-center">
                        <td>${s.rollNo}</td>
                        <td>${s.name}</td>
                        <td>${s.gender}</td>
                        <td>${s.course}</td>
                    </tr>
                `;
                });
            });
    }
</script>

</body>
</html>
