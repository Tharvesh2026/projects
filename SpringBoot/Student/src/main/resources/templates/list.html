<!DOCTYPE html>
<html>
<head>
    <title>Students List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<h2 class="text-2xl font-bold mb-4">📋 Students</h2>

<button onclick="load()" class="bg-blue-500 text-white px-4 py-2 rounded">
    Refresh
</button>

<table class="w-full mt-4 bg-white shadow rounded">
    <thead class="bg-gray-200">
    <tr>
        <th class="p-2">Roll</th>
        <th>Name</th>
        <th>Gender</th>
        <th>Course</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody id="table"></tbody>
</table>

<br>
<a href="/" class="text-blue-500">Back</a>

<script>
    function load() {

        fetch("http://localhost:9090/api/v01/students")
            .then(res => res.json())
            .then(data => {

                let table = document.getElementById("table");
                table.innerHTML = "";

                data.data.forEach(s => {
                    table.innerHTML += `
                    <tr class="text-center border-b">
                        <td class="p-2">${s.rollNo}</td>
                        <td>${s.name}</td>
                        <td>${s.gender}</td>
                        <td>${s.course}</td>
                        <td>
                            <button onclick="deleteStudent(${s.rollNo})"
                                class="bg-red-500 text-white px-2 py-1 rounded">
                                Delete
                            </button>
                        </td>
                    </tr>
                `;
                });
            });
    }

    function deleteStudent(id) {
        fetch(`http://localhost:9090/api/v01/students/${id}`, {
            method: "DELETE"
        }).then(() => load());
    }

    load();
</script>

</body>
</html>
