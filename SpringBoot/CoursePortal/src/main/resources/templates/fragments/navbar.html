<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<nav class="navbar" th:fragment="navbar">
    <div style="display:flex; align-items:center; gap:24px;">
        <a href="/" class="brand-logo">
            <div class="brand-icon">
                <i class="mdi mdi-school"></i>
            </div>
            <div>
                <div class="brand-title">CoursePortal</div>
                <div class="brand-subtitle">i.Core Federated Security</div>
            </div>
        </a>

        <!-- Main Navigation Links -->
        <div class="nav-links">
            <a th:href="@{/courses}" th:classappend="${currentUri == '/courses' || currentUri == '/'} ? 'active'" class="nav-link">
                <i class="mdi mdi-bookshelf"></i> Catalog
            </a>

            <a sec:authorize="hasAnyRole('USER', 'ADMIN', 'SYS_ADMIN')" th:href="@{/my-courses}" th:classappend="${currentUri == '/my-courses'} ? 'active'" class="nav-link">
                <i class="mdi mdi-bookmark-multiple"></i> My Courses
            </a>

            <a sec:authorize="hasAnyRole('ADMIN', 'SYS_ADMIN')" th:href="@{/admin/dashboard}" th:classappend="${currentUri == '/admin/dashboard'} ? 'active'" class="nav-link">
                <i class="mdi mdi-shield-check"></i> Admin Panel
            </a>

            <a sec:authorize="hasRole('SYS_ADMIN')" th:href="@{/sysadmin/dashboard}" th:classappend="${currentUri == '/sysadmin/dashboard'} ? 'active'" class="nav-link">
                <i class="mdi mdi-cog"></i> SYS Admin
            </a>
        </div>
    </div>

    <!-- User & Profile Control -->
    <div class="user-panel">
        <span sec:authorize="isAuthenticated()" style="display:flex; align-items:center; gap:12px;">
            <a th:href="@{/profile}" th:classappend="${currentUri == '/profile'} ? 'active'" class="nav-link" style="padding:4px 8px;">
                <i class="mdi mdi-account-circle"></i> Profile
            </a>
            <a th:href="@{/settings}" th:classappend="${currentUri == '/settings'} ? 'active'" class="nav-link" style="padding:4px 8px;">
                <i class="mdi mdi-cog"></i>
            </a>
            <span class="badge"
                  th:classappend="${userRole == 'SYS_ADMIN'} ? 'badge-sysadmin' : (${userRole == 'ADMIN'} ? 'badge-admin' : 'badge-user')"
                  th:text="${userRole != null ? userRole : 'USER'}">USER</span>
            <a th:href="@{/logout}" class="btn btn-secondary btn-sm"><i class="mdi mdi-logout"></i> Logout</a>
        </span>

        <span sec:authorize="isAnonymous()" style="display:flex; align-items:center; gap:10px;">
            <span class="badge badge-guest">GUEST</span>
            <a th:href="@{/oauth2/authorization/icore}" class="btn"><i class="mdi mdi-key-variant"></i> Login with i.Core</a>
        </span>
    </div>
</nav>
</html>
