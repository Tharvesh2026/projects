<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — CoursePortal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/tabler-icons.min.css">
    <style>
        :root {
            --bg: #0b0f19;
            --surface-1: #131b2e;
            --surface-2: #1e293b;
            --brand-primary: #8b5cf6;
            --brand-gradient: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-purple: rgba(139, 92, 246, 0.3);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            background-image: radial-gradient(at 10% 10%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            padding: 24px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(19, 27, 46, 0.75); backdrop-filter: blur(16px);
            border: 1px solid var(--border-purple); padding: 16px 24px; border-radius: var(--radius-lg); margin-bottom: 32px;
        }
        .brand-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text-main); }
        .brand-icon { width: 40px; height: 40px; background: var(--brand-gradient); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 20px; color: white; }
        .brand-title { font-size: 18px; font-weight: 800; }
        .brand-subtitle { font-size: 11px; color: #c4b5fd; font-weight: 600; }
        .nav-links { display: flex; gap: 12px; }
        .nav-link { color: var(--text-sub); text-decoration: none; font-size: 13.5px; font-weight: 600; padding: 8px 14px; border-radius: var(--radius-sm); }
        .nav-link:hover, .nav-link.active { color: white; background: rgba(139, 92, 246, 0.15); border: 1px solid var(--border-purple); }
        .user-panel { display: flex; align-items: center; gap: 12px; }
        .btn { background: var(--brand-gradient); color: white; border: none; padding: 10px 18px; border-radius: var(--radius-md); font-weight: 600; font-size: 13.5px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-secondary { background: var(--surface-2); border: 1px solid var(--border-subtle); color: var(--text-main); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge-sysadmin { background: rgba(139, 92, 246, 0.2); color: #c4b5fd; border: 1px solid rgba(139, 92, 246, 0.4); }
        .badge-admin { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }
        .badge-user { background: rgba(245, 158, 11, 0.2); color: #fde047; border: 1px solid rgba(245, 158, 11, 0.4); }

        .panel { background: var(--surface-1); border: 1px solid var(--border-purple); border-radius: var(--radius-lg); padding: 32px; margin-bottom: 24px; }
        .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; }
        .avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--brand-gradient); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: white; border: 2px solid var(--border-purple); }
        .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .field-item { background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle); padding: 16px; border-radius: var(--radius-md); }
        .field-label { font-size: 11px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .field-val { font-size: 15px; font-weight: 600; color: white; font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body>

<div class="container">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="panel">
        <div class="profile-header">
            <div class="avatar" th:text="${userName != null ? #strings.substring(userName,0,1) : 'U'}">U</div>
            <div>
                <h2 style="font-size:22px; font-weight:800; color:white;" th:text="${userName != null ? userName : 'Authenticated User'}">User Name</h2>
                <div style="font-size:13px; color:var(--text-sub);" th:text="${userEmail}">email@domain.com</div>
                <div style="margin-top:6px;">
                    <span class="badge" th:classappend="${userRole == 'SYS_ADMIN'} ? 'badge-sysadmin' : (${userRole == 'ADMIN'} ? 'badge-admin' : 'badge-user')" th:text="${userRole != null ? userRole : 'USER'}">USER</span>
                </div>
            </div>
        </div>

        <h3 style="font-size:15px; font-weight:700; color:#c4b5fd; margin-bottom:16px;"><i class="ti ti-key"></i> Federated OIDC User Identity Claims</h3>
        <div class="field-grid">
            <div class="field-item">
                <div class="field-label">Subject ID (sub)</div>
                <div class="field-val" th:text="${userSub != null ? userSub : 'N/A'}">3</div>
            </div>
            <div class="field-item">
                <div class="field-label">Email Address</div>
                <div class="field-val" th:text="${userEmail != null ? userEmail : 'N/A'}">user@icore.dev</div>
            </div>
            <div class="field-item">
                <div class="field-label">Role Group Claim</div>
                <div class="field-val" th:text="${userRole != null ? userRole : 'USER'}">SYS_ADMIN</div>
            </div>
            <div class="field-item">
                <div class="field-label">Assigned Authorities</div>
                <div class="field-val" style="font-size:13px;" th:text="${userPermissions != null ? userPermissions : 'ROLE_USER'}">[READ, WRITE]</div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
