spring.application.name=CoursePortal
server.port=8081
server.address=0.0.0.0

# Database Configuration (H2 In-Memory for instant portability; switch to MySQL if desired)
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:courseportal;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Spring Security OAuth2 / OIDC Client Settings
spring.security.oauth2.client.registration.icore.client-id=course-register-IfN44S
spring.security.oauth2.client.registration.icore.client-secret=ic_sec_kibNaLib27oXRdLmf5Htln5FqyhvBUT7
spring.security.oauth2.client.registration.icore.client-name=i.Core Identity
spring.security.oauth2.client.registration.icore.provider=icore-provider
spring.security.oauth2.client.registration.icore.scope=openid,profile,email
spring.security.oauth2.client.registration.icore.redirect-uri={baseUrl}/login/oauth2/code/icore
spring.security.oauth2.client.registration.icore.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.icore.client-authentication-method=client_secret_basic

spring.security.oauth2.client.provider.icore-provider.issuer-uri=http://localhost:8080
spring.security.oauth2.client.provider.icore-provider.user-name-attribute=sub
