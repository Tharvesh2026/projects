<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout('Dashboard Overview', ~{::div})}">
<body>
    <div>
        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="glass-card stat-card">
                <span class="stat-label">Total Domains</span>
                <span class="stat-value" th:text="${#lists.size(domains)}">0</span>
            </div>
            <div class="glass-card stat-card">
                <span class="stat-label">Active Instances</span>
                <span class="stat-value">3</span> <!-- Placeholder until we hook up VM service -->
            </div>
            <div class="glass-card stat-card">
                <span class="stat-label">Network Zones</span>
                <span class="stat-value">1</span>
            </div>
        </div>

        <!-- Domains Table -->
        <div class="glass-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2>CloudStack Domains</h2>
                <div style="display: flex; gap: 1rem;">
                    <button type="button" class="btn btn-secondary" onclick="document.getElementById('createCompanyModal').style.display='flex'">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        Add Company
                    </button>
                    <form th:action="@{/dashboard/sync}" method="post" style="margin: 0;">
                        <button type="submit" class="btn btn-primary">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.92-10.44l5.67-5.67"/></svg>
                            Sync Domains
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Local ID</th>
                            <th>CloudStack UUID</th>
                            <th>Domain Name</th>
                            <th>Path</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="domain : ${domains}">
                            <td th:text="${domain.id}">1</td>
                            <td th:text="${domain.uuid}" style="font-family: monospace; color: var(--accent-primary);">UUID</td>
                            <td th:text="${domain.name}" style="font-weight: 500;">Name</td>
                            <td th:text="${domain.path}">Path</td>
                        </tr>
                        <tr th:if="${domains.empty}">
                            <td colspan="4" style="text-align: center; color: var(--text-secondary);">No domains found. Please click sync to fetch from CloudStack.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Create Company Modal -->
    <div id="createCompanyModal" class="modal-overlay" style="display: none;">
        <div class="glass-card modal-content">
            <div class="modal-header">
                <h2>Add Company</h2>
                <button class="close-btn" onclick="document.getElementById('createCompanyModal').style.display='none'">&times;</button>
            </div>
            
            <form th:action="@{/dashboard/domains/create}" method="post">
                <div class="form-group">
                    <label for="companyName">Company Name</label>
                    <input type="text" id="companyName" name="companyName" class="form-control" placeholder="e.g. Viens Solution" required>
                    <small style="color: var(--text-secondary); display: block; margin-top: 0.5rem;">Will be converted to lowercase for CloudStack compatibility.</small>
                </div>
                
                <div class="modal-footer" style="margin-top: 2rem; display: flex; justify-content: flex-end; gap: 1rem;">
                    <button type="button" class="btn btn-secondary" onclick="document.getElementById('createCompanyModal').style.display='none'">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Company</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
