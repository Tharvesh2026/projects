<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">IaaS Console</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12h4l3-9 5 18 3-9h5"/>
                </svg>
                IaaS Console
            </div>
            
            <ul class="nav-links">
                <li>
                    <a th:href="@{/dashboard}" class="nav-link" th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                        Dashboard
                    </a>
                </li>
                <li>
                    <a th:href="@{/instances}" class="nav-link" th:classappend="${activePage == 'instances' ? 'active' : ''}">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                        Virtual Machines
                    </a>
                </li>
                <li>
                    <a th:href="@{/networks}" class="nav-link" th:classappend="${activePage == 'networks' ? 'active' : ''}">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                        Networks
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="page-title" th:text="${title}">Dashboard</div>
                
                <div class="user-profile">
                    <span th:text="${username}">User</span>
                    <img th:if="${avatarUrl != null}" th:src="${avatarUrl}" alt="Avatar" class="avatar"/>
                    <div th:unless="${avatarUrl != null}" class="avatar" style="background: var(--accent-primary); display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--bg-dark);">
                        <span th:text="${#strings.substring(username,0,1).toUpperCase()}">U</span>
                    </div>
                </div>
            </header>

            <!-- Dynamic Content Area -->
            <div class="content-area">
                <div th:replace="${content}"></div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
