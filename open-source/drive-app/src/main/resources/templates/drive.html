<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('My Drive')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="main">
        <div class="breadcrumb">
            <a th:href="@{/drive}">Drive</a>
            <th:block th:each="crumb : ${breadcrumb}">
                <span class="sep">/</span>
                <a th:href="@{'/drive/folder/' + ${crumb.id}}" th:text="${crumb.name}">folder</a>
            </th:block>
        </div>

        <div class="toolbar">
            <details>
                <summary class="btn">+ New folder</summary>
                <form th:action="@{/drive/folder}" method="post" style="margin-top:10px; display:flex; gap:8px;">
                    <input type="hidden" name="parentId" th:value="${currentFolderId}"/>
                    <input type="text" name="name" placeholder="Folder name" required
                           style="padding:8px 10px; border:1px solid var(--line); border-radius:3px; font-family:inherit;"/>
                    <button type="submit" class="btn btn-primary">Create</button>
                </form>
            </details>

            <details>
                <summary class="btn btn-primary">↑ Upload file</summary>
                <form th:action="@{/drive/upload}" method="post" enctype="multipart/form-data"
                      style="margin-top:10px; display:flex; gap:8px; align-items:center;">
                    <input type="hidden" name="folderId" th:value="${currentFolderId}"/>
                    <input type="file" name="file" required/>
                    <button type="submit" class="btn btn-primary">Upload</button>
                </form>
            </details>

            <form th:action="@{/drive/search}" method="get" class="search-box">
                <input type="text" name="q" placeholder="Search by name..." required/>
                <button type="submit" class="btn">Search</button>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(subfolders)} and ${#lists.isEmpty(files)}" class="empty-state">
            Nothing filed here yet. Create a folder or upload a file to get started.
        </div>

        <div th:unless="${#lists.isEmpty(subfolders)}">
            <div class="section-label">Folders</div>
            <div class="item-grid">
                <div class="item-card folder" th:each="folder : ${subfolders}">
                    <div class="icon">folder</div>
                    <a class="name" th:href="@{'/drive/folder/' + ${folder.id}}" th:text="${folder.name}">Folder name</a>
                    <div class="item-actions">
                        <form th:action="@{'/drive/folder/' + ${folder.id} + '/share'}" method="post">
                            <button type="submit" class="link-btn">share</button>
                        </form>
                        <form th:action="@{'/drive/folder/' + ${folder.id} + '/delete'}" method="post"
                              onsubmit="return confirm('Delete this folder? It must be empty.');">
                            <button type="submit" class="link-btn danger">delete</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div th:unless="${#lists.isEmpty(files)}">
            <div class="section-label">Files</div>
            <div class="item-grid">
                <div class="item-card file" th:each="file : ${files}">
                    <div class="icon" th:text="${file.format ?: file.resourceType}">file</div>
                    <span class="name" th:text="${file.name}">file.pdf</span>
                    <div class="meta" th:if="${file.bytes != null}" th:text="${#numbers.formatInteger(file.bytes / 1024, 1)} + ' KB'">size</div>
                    <div class="item-actions">
                        <a th:href="@{'/drive/file/' + ${file.id} + '/download'}">download</a>
                        <form th:action="@{'/drive/file/' + ${file.id} + '/share'}" method="post">
                            <button type="submit" class="link-btn">share</button>
                        </form>
                        <form th:action="@{'/drive/file/' + ${file.id} + '/delete'}" method="post"
                              onsubmit="return confirm('Delete this file? This cannot be undone.');">
                            <button type="submit" class="link-btn danger">delete</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
