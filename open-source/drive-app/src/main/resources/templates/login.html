<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Log in')}"></head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <div class="brand"><span class="tab-icon" style="background:#c99a4b"></span> Filed</div>
        <div class="tagline">your own drive, filed away safely</div>

        <div class="flash-info" th:if="${param.registered}">Account created — log in below.</div>
        <div class="flash-info" th:if="${param.logout}">You've been logged out.</div>
        <div class="flash-error" th:if="${param.error}">Wrong username or password.</div>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus/>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required/>
            </div>
            <button type="submit" class="btn btn-primary">Log in</button>
        </form>

        <div class="auth-switch">
            No account yet? <a th:href="@{/register}">Register</a>
        </div>
    </div>
</div>
</body>
</html>
