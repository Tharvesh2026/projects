<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Register')}"></head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <div class="brand"><span class="tab-icon" style="background:#c99a4b"></span> Filed</div>
        <div class="tagline">create your drive</div>

        <div class="flash-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/register}" th:object="${registerForm}" method="post">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" th:field="*{username}" required autofocus/>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" required/>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" required/>
            </div>
            <button type="submit" class="btn btn-primary">Create account</button>
        </form>

        <div class="auth-switch">
            Already have an account? <a th:href="@{/login}">Log in</a>
        </div>
    </div>
</div>
</body>
</html>
