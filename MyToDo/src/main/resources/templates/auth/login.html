<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f4f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #d1d5db;
            --success: #16a34a;
            --success-bg: #dcfce7;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,.18);
        }

        .logo {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
            color: var(--text);
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin: 8px 0 30px;
        }

        .alert {
            display: none;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: .95rem;
        }

        .alert.error {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .alert.success {
            background: var(--success-bg);
            color: var(--success);
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            transition: .2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,.15);
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
            user-select: none;
        }

        button {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: .25s;
        }

        button:hover {
            background: var(--primary-dark);
        }

        .footer {
            margin-top: 28px;
            text-align: center;
            color: var(--muted);
            font-size: .9rem;
        }

        @media (max-width:480px){
            .card{
                padding:30px 24px;
            }
        }
    </style>
</head>
<body>

<div class="card">

    <div class="logo">🔒</div>

    <h1>Welcome Back</h1>
    <p class="subtitle">
        Sign in to continue
    </p>

    <div id="message" class="alert"></div>

    <form th:action="@{/login}" method="post">

        <div class="field">
            <label for="username">Username</label>
            <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="Enter your username"
                    autofocus
                    required>
        </div>

        <div class="field">
            <label for="password">Password</label>

            <div class="password-wrapper">
                <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Enter your password"
                        required>

                <span class="toggle-password" onclick="togglePassword()">👁</span>
            </div>
        </div>

        <button type="submit">
            Sign In
        </button>

    </form>

    <div class="footer">
        Spring Boot • Spring Security
    </div>

</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const message = document.getElementById("message");

    if (params.has("error")) {
        message.style.display = "block";
        message.classList.add("error");
        message.innerText = "Invalid username or password.";
    }

    if (params.has("logout")) {
        message.style.display = "block";
        message.classList.add("success");
        message.innerText = "You have been logged out successfully.";
    }

    function togglePassword() {
        const input = document.getElementById("password");

        input.type = input.type === "password"
            ? "text"
            : "password";
    }
</script>

</body>
</html>
